# Cloud Build configuration for automatic deployments
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'gcr.io/fisiotool-pro-2026/fisio-backend:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/fisiotool-pro-2026/fisio-backend:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fisio-backend-omega'
      - '--image'
      - 'gcr.io/fisiotool-pro-2026/fisio-backend:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300s'

images:
  - 'gcr.io/fisiotool-pro-2026/fisio-backend:latest'

timeout: '1200s'
